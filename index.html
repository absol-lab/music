<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="2.5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Musilabo</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{ --bg:#141210; --panel:#1e1a17; --panel2:#262019; --line:#3a332a; --tx:#ece5d8; --sub:#a99e8c; --acc:#d8a24a; --acc2:#7fb0a5; --red:#e5484d; --green:#46a758; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; touch-action:manipulation; }
body{ padding-bottom:96px; }
#veil{ position:fixed; inset:0; background:#000; z-index:99; transition:opacity .6s ease; }
header{ position:sticky; top:0; z-index:20; background:rgba(20,18,16,.92); backdrop-filter:blur(8px); padding:18px 14px 8px; border-bottom:1px solid var(--line); }
h1{ font-size:1.06em; margin:0; letter-spacing:.14em; font-weight:700; }
h1 .en{ color:var(--acc); font-size:.72em; letter-spacing:.22em; margin-left:8px; }
#syncbar{ display:flex; align-items:center; gap:7px; margin-top:7px; background:none; border:none; color:var(--sub); font-size:.8em; padding:4px 0; cursor:pointer; text-align:left; }
#syncdot{ width:8px; height:8px; border-radius:50%; background:var(--red); flex:none; }
.sbhint{ color:var(--acc); }
main{ padding:12px 14px 0; max-width:640px; margin:0 auto; }
.view{ display:none; touch-action:pan-y; }
.view.on{ display:block; }
.view.on.fwd{ animation:vinR .28s ease; }
.view.on.bwd{ animation:vinL .28s ease; }
@keyframes vinR{ from{ opacity:0; transform:translateX(44px);} to{ opacity:1; transform:none;} }
@keyframes vinL{ from{ opacity:0; transform:translateX(-44px);} to{ opacity:1; transform:none;} }
.secttl{ font-size:1em; margin:16px 2px 8px; letter-spacing:.06em; }
.note{ color:var(--sub); font-size:.83em; line-height:1.65; }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
.recrow{ display:flex; gap:12px; align-items:flex-start; }
.scorebox{ flex:none; width:58px; text-align:center; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:7px 0 5px; }
.scorebox .num{ font-size:24px; font-weight:800; color:var(--acc); line-height:1; }
.scorebox .lbl{ font-size:9px; color:var(--sub); margin-top:3px; letter-spacing:.1em; }
.atitle{ font-size:15px; font-weight:700; line-height:1.35; }
.aartist{ color:var(--acc2); font-size:.86em; margin-top:1px; }
.ameta{ color:var(--sub); font-size:.76em; margin-top:3px; }
.areason{ font-size:.83em; line-height:1.6; margin-top:6px; color:#d9d0bf; }
.axchips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.axchip{ font-size:.68em; color:var(--sub); border:1px solid var(--line); border-radius:999px; padding:3px 8px; }
.axchip b{ color:var(--acc); font-weight:700; }
.btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
.recfoot{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
.recfoot .stars{ margin-top:0; }
.recfoot .btnrow{ margin-top:0; margin-left:auto; }
.btn{ appearance:none; border:1px solid var(--line); background:var(--panel2); color:var(--tx); border-radius:999px; padding:11px 18px; min-height:48px; font-size:.85em; cursor:pointer; }
.btn.primary{ background:var(--acc); border-color:var(--acc); color:#1c1508; font-weight:700; }
.btn.small{ min-height:44px; padding:8px 14px; font-size:.8em; }
.btn.on{ background:var(--acc); color:#1c1508; border-color:var(--acc); font-weight:700; }
.stars{ display:flex; gap:4px; margin-top:8px; }
.stars button{ appearance:none; background:none; border:none; font-size:22px; color:#574c3a; padding:4px; cursor:pointer; min-width:40px; min-height:40px; }
.stars button.lit{ color:var(--acc); }
textarea,input.textin,select.textin{ width:100%; background:#17140f; border:1px solid var(--line); border-radius:10px; color:var(--tx); padding:11px 12px; font-size:.92em; }
textarea{ min-height:56px; resize:vertical; }
.chiprow{ display:flex; gap:7px; flex-wrap:wrap; margin:8px 0 4px; }
.tagchip{ border:1px solid var(--line); background:var(--panel); color:var(--sub); border-radius:999px; padding:7px 13px; font-size:.8em; min-height:44px; cursor:pointer; }
.tagchip.on{ background:var(--acc); color:#1c1508; border-color:var(--acc); font-weight:700; }
/* timeline */
.tl{ position:relative; margin:6px 0 0 6px; padding-left:26px; }
.tl::before{ content:""; position:absolute; left:8px; top:0; bottom:0; width:3px; border-radius:2px; background:linear-gradient(to bottom,#8a6d3b,#b08968 18%,#7fb0a5 38%,#a26769 55%,#5e548e 72%,#d8a24a 88%,#ece5d8); }
.tl-era{ margin:20px 0 6px -26px; padding-left:26px; font-weight:800; letter-spacing:.08em; font-size:.95em; }
.tl-era span{ color:var(--sub); font-weight:400; font-size:.8em; margin-left:8px; }
.tl-ev{ position:relative; margin-bottom:12px; }
.tl-ev::before{ content:""; position:absolute; left:-23px; top:5px; width:9px; height:9px; border-radius:50%; background:var(--bg); border:2px solid var(--acc); }
.tl-year{ color:var(--acc); font-weight:800; font-size:.86em; }
.tl-title{ font-weight:700; font-size:.95em; margin-left:8px; }
.tl-note{ color:#cfc5b2; font-size:.82em; line-height:1.6; margin-top:3px; }
/* graph */


#dsheet{ position:fixed; inset:0; background:rgba(8,6,4,.62); z-index:60; display:none; }
#dsheet.on{ display:block; }
#dcard{ position:absolute; left:0; right:0; bottom:0; max-height:88vh; overflow-y:auto; background:var(--panel); border-top:1px solid var(--line); border-radius:18px 18px 0 0; padding:16px 16px 34px; touch-action:pan-y; }
.agrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px 10px; }
.atile{ appearance:none; background:none; border:none; padding:0; cursor:pointer; text-align:center; }
.atile img, .atile .aph{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; display:block; background:var(--panel2); border:1px solid var(--line); }
.atile .aph{ display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--acc); font-weight:700; }
.atile .aname{ font-size:.98em; font-weight:600; margin-top:6px; line-height:1.3; color:var(--ink); }
.atile .ayears{ font-size:.68em; color:var(--sub); }
.ptile{ appearance:none; background:none; border:1px solid var(--line); border-radius:12px; padding:0; cursor:pointer; overflow:hidden; text-align:left; }
.ptile img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
.ptile .aname{ font-size:.78em; padding:6px 7px; line-height:1.3; color:var(--ink); }
.axisrow{ display:flex; align-items:center; gap:8px; margin-top:5px; font-size:.82em; }
.axisbar{ flex:1; height:6px; border-radius:3px; background:var(--panel2); overflow:hidden; }
.axisbar i{ display:block; height:100%; background:var(--acc); }
.reqst{ display:inline-block; font-size:.7em; border-radius:6px; padding:2px 8px; border:1px solid var(--line); color:var(--sub); }
.reqst.done{ color:var(--green); border-color:var(--green); }
.reqst.working{ color:var(--acc); border-color:var(--acc); }

input[type=range]{ -webkit-appearance:none; appearance:none; accent-color:var(--acc); height:26px; background:transparent; cursor:pointer; }
input[type=range]::-webkit-slider-runnable-track{ height:4px; border-radius:2px; background:#4a4033; }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; background:var(--acc); border:none; margin-top:-9px; }
input[type=range]::-moz-range-track{ height:4px; border-radius:2px; background:#4a4033; }
input[type=range]::-moz-range-thumb{ width:22px; height:22px; border-radius:50%; background:var(--acc); border:none; }
.gview{ position:relative; overflow:hidden; height:min(66vh, calc((100vw - 28px) * 1.15)); min-height:340px; background:var(--panel); border:1px solid var(--line); border-radius:14px; touch-action:none; }
.gstage2{ position:absolute; left:0; top:0; transform-origin:0 0; width:980px; height:1120px; }
.gnode2{ position:absolute; transform:translate(-50%,-50%); border-radius:50%; overflow:hidden; border:2px solid var(--acc); background:#2b241b; cursor:pointer; }
.gnode2 img{ width:100%; height:100%; object-fit:cover; display:block; }
.gnode2.sel{ border-color:#ece5d8; border-width:3px; }
.gname2{ position:absolute; transform:translateX(-50%); text-align:center; font-size:12px; line-height:1.3; color:var(--ink); width:120px; pointer-events:none; }
.gzoom{ position:absolute; right:10px; bottom:10px; display:flex; gap:6px; z-index:5; }
.gzoom button{ appearance:none; border:1px solid var(--line); background:rgba(20,17,14,.88); color:var(--ink); border-radius:999px; padding:8px 13px; font-size:14px; cursor:pointer; }
.gchips{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.gchip{ appearance:none; text-align:left; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; }
.gchip span{ display:block; margin-top:3px; font-size:12px; font-weight:400; color:var(--sub); }
.gseclbl{ font-weight:700; margin:16px 0 4px; color:var(--acc); }
.grow2{ display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.gsm{ width:52px; height:52px; border-radius:8px; object-fit:cover; flex:none; border:1px solid var(--line); background:var(--panel2); }
.gwrap{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px; overflow:hidden; }
svg text{ fill:var(--tx); font-size:10.5px; }
.covwrap{ position:relative; width:48%; max-width:172px; flex:none; }
.covwrap img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; border:1px solid var(--line); background:var(--panel2); display:block; }
.covwrap .scorebox{ position:absolute; left:7px; bottom:7px; background:rgba(18,15,12,.85); border:1px solid var(--line); border-radius:10px; padding:3px 9px 5px; text-align:center; }
.covwrap .scorebox .num{ font-size:21px; }
.gstage{ position:relative; }
.gnode{ position:absolute; transform:translate(-50%,-50%); border-radius:50%; overflow:hidden; border:2px solid var(--acc); background:#2b241b; cursor:pointer; }
.gnode img{ width:100%; height:100%; object-fit:cover; display:block; }
.gnode.sel{ border-color:#ece5d8; border-width:3px; }
.gname{ position:absolute; transform:translateX(-50%); text-align:center; font-size:10.5px; line-height:1.3; color:var(--ink); width:100px; pointer-events:none; }
.cov{ width:64px; height:64px; border-radius:10px; object-fit:cover; flex:none; border:1px solid var(--line); background:var(--panel2); }
.covs{ width:88px; height:88px; border-radius:8px; object-fit:cover; flex:none; border:1px solid var(--line); background:var(--panel2); }
.publine{ color:#b7ab93; font-size:.74em; margin-top:5px; }
.publine b{ color:var(--acc2); font-weight:700; }
.reltag{ display:inline-block; font-size:.66em; border-radius:6px; padding:2px 7px; margin-right:6px; vertical-align:1px; }
.reltag.fact{ background:rgba(70,167,88,.18); color:#7fd08c; border:1px solid rgba(70,167,88,.5); }
.reltag.lineage{ background:rgba(216,162,74,.14); color:var(--acc); border:1px solid rgba(216,162,74,.5); }
svg .edge{ stroke:#5a5041; stroke-width:1.2; }
svg .edge.lin{ stroke-dasharray:4 3; stroke:#6e5a35; }
svg .elbl{ fill:#8d8171; font-size:8px; }
svg .node circle{ fill:#2b241b; stroke:var(--acc); stroke-width:1.4; cursor:pointer; }
svg .node.hub circle{ fill:#3d2f16; stroke:var(--acc); stroke-width:2.2; }
svg .node.sel circle{ fill:var(--acc); }
svg .node.sel text{ fill:#141210; font-weight:700; }
/* nav */
#nav{ position:fixed; left:50%; transform:translateX(-50%); bottom:15px; width:calc(100vw - 24px); max-width:560px; height:56px; background:rgba(30,26,23,.9); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:999px; display:flex; gap:2px; padding:4px; box-sizing:border-box; z-index:30; overflow:hidden; }
#nav button{ flex:1; background:none; border:none; border-radius:999px; color:var(--sub); height:100%; cursor:pointer; white-space:nowrap; padding:0 1px; font-size:10px; line-height:1.15; transition:background .25s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
#nav button svg{ width:21px; height:21px; flex:none; }
#nav button.on{ color:var(--tx); font-weight:700; background:rgba(216,162,74,.22); box-shadow:inset 0 0 0 1px rgba(216,162,74,.55); }
#verBadge{ position:fixed; top:calc(env(safe-area-inset-top, 0px) + 2px); left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.03em; color:var(--sub); opacity:.85; z-index:39; pointer-events:none; white-space:nowrap; }
.hrow{ display:flex; align-items:flex-start; gap:10px; }
.hrow h1{ flex:1; min-width:0; padding-top:6px; }
#bell{ position:relative; flex:none; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--tx); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
#bell svg{ width:20px; height:20px; }
#bellbdg{ position:absolute; top:-3px; right:-3px; min-width:18px; height:18px; border-radius:9px; background:var(--red); color:#fff; font-size:10px; font-weight:700; display:none; align-items:center; justify-content:center; padding:0 5px; }
#bellbdg.on{ display:flex; }
.setgroup{ background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; margin-bottom:12px; }
.setgroup>*:last-child{ border-bottom:none; }
.setrow{ display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; border-bottom:1px solid var(--line); padding:13px 14px; color:var(--tx); font-size:.95em; font-family:inherit; cursor:pointer; text-align:left; min-height:52px; }
.setrow .val{ margin-left:auto; color:var(--sub); font-size:.88em; text-align:right; }
.setrow .chev{ color:var(--sub); font-size:1.1em; flex:none; transition:transform .2s; }
.setrow.open .chev{ transform:rotate(90deg); }
.setpanel{ display:none; padding:2px 14px 14px; border-bottom:1px solid var(--line); }
.setpanel.open{ display:block; }
.histrow{ display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
.histrow:last-child{ border-bottom:none; }
.histv{ flex:none; width:46px; font-weight:800; color:var(--acc); font-size:.92em; }
.histb{ font-size:.86em; line-height:1.55; }
.histd{ color:var(--sub); font-size:.76em; margin-top:2px; }
body[data-lh="narrow"] .note, body[data-lh="narrow"] .areason, body[data-lh="narrow"] .tl-note{ line-height:1.45; }
body[data-lh="wide"] .note, body[data-lh="wide"] .areason, body[data-lh="wide"] .tl-note{ line-height:1.95; }
select.textin{ appearance:none; }
.libempty{ color:var(--sub); font-size:.86em; padding:14px 2px; }
.savedmark{ color:var(--green); font-size:.75em; margin-left:6px; }
</style>
</head>
<body>
<div id="veil"></div>
<header>
  <div class="hrow"><h1>Musilabo<span class="en">MUSIC ATLAS</span></h1><button id="bell" onclick="openHistory()" aria-label="更新履歴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span id="bellbdg"></span></button></div>
  <button id="syncbar" onclick="syncBarTap()"><span id="syncdot"></span><span id="syncmsg">読み込み中…</span></button>
</header>
<main>
  <section class="view on" id="v-rec"></section>
  <section class="view" id="v-tl"></section>
  <section class="view" id="v-graph"></section>
  <section class="view" id="v-art"></section>
  <section class="view" id="v-genre"></section>
  <section class="view" id="v-lib"></section>
  <section class="view" id="v-set"></section>
</main>
<div id="dsheet" onclick="if(event.target===this) closeDetail()"><div id="dcard"></div></div>
<nav id="nav">
  <button data-v="rec" class="on" onclick="go('rec')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg><span>おすすめ</span></button>
  <button data-v="tl" onclick="go('tl')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.1 2"/></svg><span>年表</span></button>
  <button data-v="graph" onclick="go('graph')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.8"/><circle cx="6" cy="12" r="2.8"/><circle cx="18" cy="19" r="2.8"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span>相関図</span></button>
  <button data-v="art" onclick="go('art')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>図鑑</span></button>
  <button data-v="genre" onclick="go('genre')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>探す</span></button>
  <button data-v="lib" onclick="go('lib')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="2.3"/></svg><span>マイ記録</span></button>
  <button data-v="set" onclick="go('set')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.2v2.7M12 18.1v2.7M3.2 12h2.7M18.1 12h2.7M5.8 5.8l1.9 1.9M16.3 16.3l1.9 1.9M18.2 5.8l-1.9 1.9M7.7 16.3l-1.9 1.9"/></svg><span>設定</span></button>
</nav></nav>
<div id="verBadge"></div>
<script>
"use strict";
const APP_VERSION='2.5';
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escA(s){ return esc(s); }
/* ---- storage (localStorage with in-memory fallback) ---- */
const _mem={};
function storeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in _mem)?_mem[k]:null; } }
function storeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ _mem[k]=v; } }
function storeDel(k){ try{ localStorage.removeItem(k); }catch(e){ delete _mem[k]; } }
/* ================= DATA: catalog (public work data only) ================= */
/* axes order: 官能 sen / 不穏 une / 哀愁 mel / 美 bea / 生々しさ raw / 浮遊 flo (0-5) */
const AXES=[['sen','官能'],['une','不穏'],['mel','哀愁'],['bea','美'],['raw','生々しさ'],['flo','浮遊']];
const CATALOG=[
["kind-of-blue","Kind of Blue","Miles Davis",1959,"ジャズ",[2,1,4,5,2,4],"全ジャズの入口であり到達点。音数が少なく、余白が呼吸する。モードの静けさは彼の静かな系譜の原点。","https://is1-ssl.mzstatic.com/image/thumb/Music/7f/9f/d6/mzi.vtnaewef.jpg/600x600bb.jpg","https://music.apple.com/us/album/kind-of-blue/268443092?uo=4"],

function normalizeData(d){

  if(d.world && Array.isArray(d.world.nodes) && Array.isArray(d.world.edges)) b.world={nodes:d.world.nodes, edges:d.world.edges};

}
function loadLocal(){ try{ return normalizeData(JSON.parse(storeGet(LS_DATA)||'null')); }catch(e){ return blankData(); } }

  ids.forEach(id=>{ const x=a.ratings[id], y=b.ratings[id]; out.ratings[id]=(!y)?x:(!x)?y:((+y.u||0)>(+x.u||0)?y:x); });
  const cids=new Set([...Object.keys(a.custom||{}),...Object.keys(b.custom||{})]);
  cids.forEach(id=>{ const x=a.custom[id], y=b.custom[id]; out.custom[id]=(!y)?x:(!x)?y:((+y.u||0)>(+x.u||0)?y:x); });
  const aids=new Set([...Object.keys(a.artists||{}),...Object.keys(b.artists||{})]);
  aids.forEach(id=>{ const x=a.artists[id], y=b.artists[id]; out.artists[id]=(!y)?x:(!x)?y:((+y.u||0)>(+x.u||0)?y:x); });

}
/* ================= recommendation ================= */
function highProfile(){
  const acc={}; let n=0;
  AXES.forEach(([k])=>acc[k]=0);
  CATALOG.forEach(c=>{ const r=data.ratings[c[0]]; if(r && !r.del && (r.stars||0)>=4){ AXES.forEach(([k],i)=>{ acc[k]+=c[5][i]; }); n++; } });

  AXES.forEach(([k])=>acc[k]=acc[k]/n);

function targetProfile(){
  const base=data.criteria? Object.assign({}, data.criteria) : Object.assign({}, FALLBACK_PROFILE);

  const t={}; AXES.forEach(([k])=>{ t[k]=(base[k]+hp[k])/2; });

function splitLabel(s){
  if(s.length<=13) return [s];
  const mid=Math.floor(s.length/2); let best=-1,bd=1e9;
  for(let i=0;i<s.length;i++){ if(s[i]===' '||s[i]==='/'){ const d=Math.abs(i-mid); if(d<bd){bd=d;best=i;} } }
  if(best<0) return [s];
  return [s.slice(0,best).trim(), s.slice(best+(s[best]==='/'?1:0)).trim()];
}

  const base=GRAPHS.world; const ex=(data.world&&data.world.nodes)? data.world : {nodes:[], edges:[]};

  const nodes=base.nodes.concat(ex.nodes.filter(n=>!ids.has(n[0])));
  const ekey=e=>e[0]+'|'+e[1]+'|'+e[2]; const seen=new Set(base.edges.map(ekey));
  const edges=base.edges.concat(ex.edges.filter(e=>!seen.has(ekey(e))));

const LS_RELAY='music.relay';
const RELAY_URL_DEFAULT='https://script.google.com/macros/s/AKfycbziV1Wpv7AWSUJJgaKyRzFeBR81Td4CjryGGuq4avt1xAo-e2mbeyS2vBpCuqx4_KI/exec';
function relayCfg(){ try{ const r=JSON.parse(storeGet(LS_RELAY)||'null'); return (r && r.secret)? {url:r.url||RELAY_URL_DEFAULT, secret:r.secret} : null; }catch(e){ return null; } }
function relayReady(){ return !!relayCfg(); }
async function relayCall(op, name, content){
  const c=relayCfg(); if(!c) throw new Error('中継が未設定です');
  const res=await fetch(c.url,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({secret:c.secret, op:op, name:name, content:content})});
  if(!res.ok) throw new Error('中継 HTTP '+res.status);
  const j=JSON.parse(await res.text());
  if(!j || !j.ok) throw new Error('中継エラー：'+((j&&j.error)||'unknown'));
  return j;
}
function relaySaveAndTest(){
  const u=$('relay-url-in'), s=$('relay-secret-in'), st=$('relaystat');
  const url=(u? u.value:'').trim()||RELAY_URL_DEFAULT, secret=(s? s.value:'').trim();
  if(!secret){ if(st) st.textContent='シークレットを入力してください'; return; }
  relayDraft=null;
  storeSet(LS_RELAY, JSON.stringify({url:url, secret:secret}));
  if(st) st.textContent='接続テスト中…';
  relayCall('ping').then(()=>{ renderSyncStatus(); syncNow('relay'); renderSet(); openPanelOnly('sync'); const nst=$('relaystat'); if(nst) nst.textContent='接続OK — 中継で同期します。'; })
    .catch(e=>{ const cst=$('relaystat')||st; if(cst) cst.textContent='接続に失敗しました：'+((e&&e.message)||e); });
}
function relayClear(){ relayDraft=null; storeDel(LS_RELAY); syncStatus='disconnected'; renderSyncStatus(); renderSet(); }
async function syncNow(reason){
  if(syncRunning || !relayReady()) return;
  syncRunning=true; syncStatus='syncing'; renderSyncStatus();
  try{
    const st=await relayCall('stat', DRIVE_FILE_NAME);
    let remote=null;
    if(st.exists){ const j=await relayCall('get', DRIVE_FILE_NAME); remote=normalizeData(JSON.parse(j.content)); }
    const merged=remote? mergeData(data, remote) : data;
    const changed=!remote || JSON.stringify(merged)!==JSON.stringify(remote);
    if(changed) await relayCall('put', DRIVE_FILE_NAME, JSON.stringify(merged));
    data=merged; storeSet(LS_DATA, JSON.stringify(data));
    syncStatus='synced'; lastSyncAt=Date.now();
    renderRec(); renderLib(); renderArtists(); renderGenre();
  }catch(e){ syncStatus='error'; syncErr=(e&&e.message)||String(e); }
  syncRunning=false; renderSyncStatus();
}

  document.addEventListener('click', h, true);
  setTimeout(()=>document.removeEventListener('click', h, true), 400);
}
let tabDrag=null;
function initSwipe(){
  document.addEventListener('pointerdown', e=>{
    if(tabDrag) return;
    const sh=$('dsheet'); if(sh && sh.classList.contains('on')) return;
    if(e.target && e.target.closest && e.target.closest('#nav, header, #dsheet, .gview, .gwrap, input, textarea, select')) return;
    if(e.clientX>28) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    tabDrag={id:e.pointerId, x0:e.clientX, y0:e.clientY, dx:0, mode:null};
  }, {passive:true});
  document.addEventListener('pointermove', e=>{
    if(!tabDrag || e.pointerId!==tabDrag.id) return;
    const dx=e.clientX-tabDrag.x0, dy=e.clientY-tabDrag.y0;
    if(!tabDrag.mode){
      if(Math.abs(dx)>8 || Math.abs(dy)>8) tabDrag.mode=(dx>0 && Math.abs(dx)>Math.abs(dy))? 'h':'v';
      if(tabDrag.mode==='v'){ tabDrag=null; return; }
    }
    if(tabDrag.mode==='h'){
      tabDrag.dx=Math.max(0, dx);
      const el=$('v-'+curView);
      if(el){ el.style.transition='none'; el.style.transform='translateX('+tabDrag.dx+'px)'; }
    }
  }, {passive:true});
  const end=e=>{
    if(!tabDrag || e.pointerId!==tabDrag.id) return;
    const d=tabDrag; tabDrag=null;
    if(d.mode!=='h') return;
    if(d.dx>80 && backTab()){ swallowClick(); return; }
    const el=$('v-'+curView);
    if(el){ el.style.transition='transform .2s ease'; el.style.transform=''; setTimeout(()=>{ el.style.transition=''; }, 230); }
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
}
let sheetDrag=null;
function initSheetSwipe(){
  const sh=$('dsheet'); if(!sh) return;
  sh.addEventListener('pointerdown', e=>{
    if(sheetDrag || !sh.classList.contains('on')) return;
    sheetDrag={id:e.pointerId, x0:e.clientX, y0:e.clientY, dx:0, mode:null};
  });
  sh.addEventListener('pointermove', e=>{
    if(!sheetDrag || e.pointerId!==sheetDrag.id) return;
    const dx=e.clientX-sheetDrag.x0, dy=e.clientY-sheetDrag.y0;
    if(!sheetDrag.mode){
      if(Math.abs(dx)>8 || Math.abs(dy)>8) sheetDrag.mode=(dx>0 && Math.abs(dx)>Math.abs(dy))? 'h':'v';
      if(sheetDrag.mode==='v'){ sheetDrag=null; return; }
    }
    if(sheetDrag.mode==='h'){
      sheetDrag.dx=Math.max(0, dx);
      const card=$('dcard');
      if(card){ card.style.transition='none'; card.style.transform='translateX('+sheetDrag.dx+'px)'; }
      sh.style.background='rgba(8,6,4,'+Math.max(0, 0.62*(1-sheetDrag.dx/420)).toFixed(3)+')';
    }
  });
  const end=e=>{
    if(!sheetDrag || e.pointerId!==sheetDrag.id) return;
    const d=sheetDrag; sheetDrag=null;
    if(d.mode!=='h') return;
    if(d.dx>80){ closeDetail(); swallowClick(); return; }
    const card=$('dcard');
    if(card){ card.style.transition='transform .2s ease'; card.style.transform=''; setTimeout(()=>{ card.style.transition=''; }, 230); }
    sh.style.background='';
  };
  sh.addEventListener('pointerup', end);
  sh.addEventListener('pointercancel', end);
}
/* ================= boot ================= */
function selfUpdate(){
  try{
    fetch(location.href.split('#')[0], {cache:'no-store'}).then(r=>r.text()).then(tx=>{
      const m=tx.match(/name="app-version" content="([\d.]+)"/);
      if(m && m[1]!==APP_VERSION && !sessionStorage.getItem('musicUpd')){
        sessionStorage.setItem('musicUpd','1');
        location.replace(location.href.split('#')[0]+'?v='+m[1]);
      }
    }).catch(()=>{});
  }catch(e){}
}
function boot(){
  $('verBadge').textContent='v'+APP_VERSION;
  applyUi(); renderBell(); initSwipe(); initSheetSwipe();
  renderRec(); renderTl(); renderGraph(); renderLib(); renderSet(); renderArtists(); renderGenre(); renderSyncStatus();
  const veil=$('veil'); if(veil){ veil.style.opacity='0'; setTimeout(()=>veil.remove(), 700); }
  if(relayReady()) syncNow('startup');
  selfUpdate();
}
document.addEventListener('click', e=>{ if(e.target && e.target.closest && e.target.closest('button, a.btn, .tagchip, .atile, .ptile, .gchip')) playTap(); });
document.addEventListener('DOMContentLoaded', boot);

</script>

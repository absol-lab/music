<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Musilabo</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{ --bg:#141210; --panel:#1e1a17; --panel2:#262019; --line:#3a332a; --tx:#ece5d8; --sub:#a99e8c; --acc:#d8a24a; --acc2:#7fb0a5; --red:#e5484d; --green:#46a758; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; touch-action:manipulation; }
body{ padding-bottom:96px; }
#veil{ position:fixed; inset:0; background:#000; z-index:99; transition:opacity .6s ease; }
header{ position:sticky; top:0; z-index:20; background:rgba(20,18,16,.92); backdrop-filter:blur(8px); padding:10px 14px 8px; border-bottom:1px solid var(--line); }
h1{ font-size:1.06em; margin:0; letter-spacing:.14em; font-weight:700; }
h1 .en{ color:var(--acc); font-size:.72em; letter-spacing:.22em; margin-left:8px; }
#syncbar{ display:flex; align-items:center; gap:7px; margin-top:7px; background:none; border:none; color:var(--sub); font-size:.8em; padding:4px 0; cursor:pointer; text-align:left; }
#syncdot{ width:8px; height:8px; border-radius:50%; background:var(--red); flex:none; }
.sbhint{ color:var(--acc); }
main{ padding:12px 14px 0; max-width:640px; margin:0 auto; }
.view{ display:none; }
.view.on{ display:block; animation:fadein .25s ease; }
@keyframes fadein{ from{ opacity:0; transform:translateX(8px);} to{ opacity:1; transform:none;} }
.secttl{ font-size:1em; margin:16px 2px 8px; letter-spacing:.06em; }
.note{ color:var(--sub); font-size:.83em; line-height:1.65; }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
.recrow{ display:flex; gap:12px; align-items:flex-start; }
.scorebox{ flex:none; width:58px; text-align:center; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:7px 0 5px; }
.scorebox .num{ font-size:24px; font-weight:800; color:var(--acc); line-height:1; }
.scorebox .lbl{ font-size:9px; color:var(--sub); margin-top:3px; letter-spacing:.1em; }
.atitle{ font-size:15px; font-weight:700; line-height:1.35; }
.aartist{ color:var(--acc2); font-size:.86em; margin-top:1px; }
.ameta{ color:var(--sub); font-size:.76em; margin-top:3px; }
.areason{ font-size:.83em; line-height:1.6; margin-top:6px; color:#d9d0bf; }
.axchips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.axchip{ font-size:.68em; color:var(--sub); border:1px solid var(--line); border-radius:999px; padding:3px 8px; }
.axchip b{ color:var(--acc); font-weight:700; }
.btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
.btn{ appearance:none; border:1px solid var(--line); background:var(--panel2); color:var(--tx); border-radius:999px; padding:11px 18px; min-height:48px; font-size:.85em; cursor:pointer; }
.btn.primary{ background:var(--acc); border-color:var(--acc); color:#1c1508; font-weight:700; }
.btn.small{ min-height:44px; padding:8px 14px; font-size:.8em; }
.btn.on{ background:var(--acc); color:#1c1508; border-color:var(--acc); font-weight:700; }
.stars{ display:flex; gap:4px; margin-top:8px; }
.stars button{ appearance:none; background:none; border:none; font-size:22px; color:#574c3a; padding:4px; cursor:pointer; min-width:40px; min-height:40px; }
.stars button.lit{ color:var(--acc); }
textarea,input.textin,select.textin{ width:100%; background:#17140f; border:1px solid var(--line); border-radius:10px; color:var(--tx); padding:11px 12px; font-size:.92em; }
textarea{ min-height:56px; resize:vertical; }
.chiprow{ display:flex; gap:7px; flex-wrap:wrap; margin:8px 0 4px; }
.tagchip{ border:1px solid var(--line); background:var(--panel); color:var(--sub); border-radius:999px; padding:7px 13px; font-size:.8em; min-height:44px; cursor:pointer; }
.tagchip.on{ background:var(--acc); color:#1c1508; border-color:var(--acc); font-weight:700; }
/* timeline */
.tl{ position:relative; margin:6px 0 0 6px; padding-left:26px; }
.tl::before{ content:""; position:absolute; left:8px; top:0; bottom:0; width:3px; border-radius:2px; background:linear-gradient(to bottom,#8a6d3b,#b08968 18%,#7fb0a5 38%,#a26769 55%,#5e548e 72%,#d8a24a 88%,#ece5d8); }
.tl-era{ margin:20px 0 6px -26px; padding-left:26px; font-weight:800; letter-spacing:.08em; font-size:.95em; }
.tl-era span{ color:var(--sub); font-weight:400; font-size:.8em; margin-left:8px; }
.tl-ev{ position:relative; margin-bottom:12px; }
.tl-ev::before{ content:""; position:absolute; left:-23px; top:5px; width:9px; height:9px; border-radius:50%; background:var(--bg); border:2px solid var(--acc); }
.tl-year{ color:var(--acc); font-weight:800; font-size:.86em; }
.tl-title{ font-weight:700; font-size:.95em; margin-left:8px; }
.tl-note{ color:#cfc5b2; font-size:.82em; line-height:1.6; margin-top:3px; }
/* graph */
.gwrap{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px; overflow:hidden; }
svg text{ fill:var(--tx); font-size:10.5px; }
svg .edge{ stroke:#5a5041; stroke-width:1.2; }
svg .elbl{ fill:#8d8171; font-size:8px; }
svg .node circle{ fill:#2b241b; stroke:var(--acc); stroke-width:1.4; cursor:pointer; }
svg .node.hub circle{ fill:#3d2f16; stroke:var(--acc); stroke-width:2.2; }
svg .node.sel circle{ fill:var(--acc); }
svg .node.sel text{ fill:#141210; font-weight:700; }
/* nav */
#nav{ position:fixed; left:50%; transform:translateX(-50%); bottom:15px; width:calc(100vw - 92px); max-width:430px; height:56px; background:rgba(30,26,23,.9); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:999px; display:flex; z-index:30; overflow:hidden; }
#navind{ position:absolute; top:4px; bottom:4px; border-radius:999px; background:rgba(216,162,74,.22); border:1px solid rgba(216,162,74,.55); transition:left .45s cubic-bezier(.3,.9,.3,1), width .45s cubic-bezier(.3,.9,.3,1); }
#nav button{ flex:1; position:relative; z-index:1; background:none; border:none; color:var(--sub); font-size:10px; height:100%; cursor:pointer; letter-spacing:.04em; }
#nav button.on{ color:var(--tx); font-weight:700; }
#verBadge{ position:fixed; right:10px; bottom:10px; font-size:10px; color:var(--sub); opacity:.75; z-index:25; }
select.textin{ appearance:none; }
.libempty{ color:var(--sub); font-size:.86em; padding:14px 2px; }
.savedmark{ color:var(--green); font-size:.75em; margin-left:6px; }
</style>
</head>
<body>
<div id="veil"></div>
<header>
  <h1>Musilabo<span class="en">MUSIC ATLAS</span></h1>
  <button id="syncbar" onclick="syncBarTap()"><span id="syncdot"></span><span id="syncmsg">読み込み中…</span></button>
</header>
<main>
  <section class="view on" id="v-rec"></section>
  <section class="view" id="v-tl"></section>
  <section class="view" id="v-graph"></section>
  <section class="view" id="v-lib"></section>
  <section class="view" id="v-set"></section>
</main>
<nav id="nav"><div id="navind"></div>
  <button data-v="rec" class="on" onclick="go('rec')">おすすめ</button>
  <button data-v="tl" onclick="go('tl')">年表</button>
  <button data-v="graph" onclick="go('graph')">相関図</button>
  <button data-v="lib" onclick="go('lib')">マイ記録</button>
  <button data-v="set" onclick="go('set')">設定</button>
</nav>
<div id="verBadge"></div>
<script>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escA(s){ return esc(s); }
/* ---- storage (localStorage with in-memory fallback) ---- */
const _mem={};
function storeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in _mem)?_mem[k]:null; } }
function storeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ _mem[k]=v; } }
function storeDel(k){ try{ localStorage.removeItem(k); }catch(e){ delete _mem[k]; } }

<script>
/* ================= app state ================= */
const LS_DATA='musicStandalone.data.v1';
const DRIVE_FILE_NAME='music.json';
const FALLBACK_PROFILE={sen:4,une:4,mel:5,bea:5,raw:3,flo:3};
let data=loadLocal();
let syncStatus='disconnected', syncRunning=false, syncTimer=null, lastSyncAt=0;
let curView='rec', curGraph='jazz', selNode=null;
function blankData(){ return { version:1, updatedAt:0, ratings:{}, custom:{}, criteria:null, criteriaUpdatedAt:0 }; }
function normalizeData(d){
  const b=blankData(); if(!d || typeof d!=='object') return b;
  b.updatedAt=+d.updatedAt||0;
  if(d.ratings && typeof d.ratings==='object') b.ratings=d.ratings;
  if(d.custom && typeof d.custom==='object') b.custom=d.custom;
  if(d.criteria && typeof d.criteria==='object'){ b.criteria={}; AXES.forEach(([k])=>{ b.criteria[k]=Math.min(5,Math.max(0,+d.criteria[k]||0)); }); }
  b.criteriaUpdatedAt=+d.criteriaUpdatedAt||0;
  return b;
}
function loadLocal(){ try{ return normalizeData(JSON.parse(storeGet(LS_DATA)||'null')); }catch(e){ return blankData(); } }
function saveLocal(){ data.updatedAt=Date.now(); storeSet(LS_DATA, JSON.stringify(data)); scheduleSync(); }
function catById(id){ for(const c of CATALOG) if(c[0]===id) return c; if(data.custom[id]){ const x=data.custom[id]; return [id,x.title,x.artist,x.year||0,x.genre||'記録',[3,3,3,3,3,3],'']; } return null; }
function mergeData(a,b){
  const out=blankData();
  const ids=new Set([...Object.keys(a.ratings||{}),...Object.keys(b.ratings||{})]);
  ids.forEach(id=>{ const x=a.ratings[id], y=b.ratings[id]; out.ratings[id]=(!y)?x:(!x)?y:((+y.u||0)>(+x.u||0)?y:x); });
  const cids=new Set([...Object.keys(a.custom||{}),...Object.keys(b.custom||{})]);
  cids.forEach(id=>{ const x=a.custom[id], y=b.custom[id]; out.custom[id]=(!y)?x:(!x)?y:((+y.u||0)>(+x.u||0)?y:x); });
  const cside=(b.criteriaUpdatedAt>a.criteriaUpdatedAt)?b:a;
  out.criteria=cside.criteria; out.criteriaUpdatedAt=Math.max(a.criteriaUpdatedAt,b.criteriaUpdatedAt);
  out.updatedAt=Math.max(a.updatedAt,b.updatedAt);
  return out;
}
/* ================= recommendation ================= */
function highProfile(){
  const acc={}; let n=0;
  AXES.forEach(([k])=>acc[k]=0);
  CATALOG.forEach(c=>{ const r=data.ratings[c[0]]; if(r && !r.del && (r.stars||0)>=4){ AXES.forEach(([k],i)=>{ acc[k]+=c[5][i]; }); n++; } });
  if(!n) return null;
  AXES.forEach(([k])=>acc[k]=acc[k]/n);
  return acc;
}
function targetProfile(){
  const base=data.criteria? Object.assign({}, data.criteria) : Object.assign({}, FALLBACK_PROFILE);
  const hp=highProfile();
  if(!hp) return base;
  const t={}; AXES.forEach(([k])=>{ t[k]=(base[k]+hp[k])/2; });
  return t;
}
function scoreOf(c, t){
  let s=0; AXES.forEach(([k],i)=>{ s+=1-Math.abs(c[5][i]-t[k])/5; });
  return Math.round(s/AXES.length*100);
}
function ratingOf(id){ const r=data.ratings[id]; return (r && !r.del)? r : null; }
function setRating(id, patch){
  const cur=ratingOf(id)||{s:'',stars:0,memo:''};
  const next=Object.assign({}, cur, patch, {u:Date.now(), del:false});
  data.ratings[id]=next; saveLocal(); renderRec(); renderLib(); renderSyncStatus();
}
function clearRating(id){ data.ratings[id]={s:'',stars:0,memo:'',u:Date.now(),del:true}; saveLocal(); renderRec(); renderLib(); renderSyncStatus(); }
/* ================= views ================= */
function go(v){
  curView=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  $('v-'+v).classList.add('on');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  moveInd();
  window.scrollTo(0,0);
}
function moveInd(){
  const b=document.querySelector('#nav button.on'); const ind=$('navind');
  if(b && ind){ ind.style.left=b.offsetLeft+4+'px'; ind.style.width=(b.offsetWidth-8)+'px'; }
}
function amLink(c){ return 'https://music.apple.com/jp/search?term='+encodeURIComponent(c[2]+' '+c[1]); }
function starsHtml(id, cur){
  let h='<div class="stars" data-stars="'+id+'">';
  for(let i=1;i<=5;i++) h+='<button class="'+(cur>=i?'lit':'')+'" onclick="setRating(\''+id+'\',{stars:'+i+',s:\'heard\'})" aria-label="'+i+'つ星">★</button>';
  return h+'</div>';
}
function axesChips(c){
  const pairs=AXES.map(([k,l],i)=>[l,c[5][i]]).filter(p=>p[1]>=4).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return '<div class="axchips">'+pairs.map(p=>'<span class="axchip">'+p[0]+' <b>'+p[1]+'</b></span>').join('')+'</div>';
}
function renderRec(){
  const t=targetProfile();
  const items=CATALOG.map(c=>({c, s:scoreOf(c,t)})).filter(x=>{ const r=ratingOf(x.c[0]); return !(r && r.s==='heard'); }).sort((a,b)=>b.s-a.s);
  let h='<div class="secttl">おすすめ <span style="color:var(--sub);font-size:.78em">— 好みの軸で採点（RYM×Pitchfork 風）</span></div>';
  h+='<div class="note">官能・不穏・哀愁・美・生々しさ・浮遊の6軸で各盤を採点し、好みプロフィールとの近さで順位付けしています。★4以上で「聞いた」にすると、プロフィールが自動で寄っていきます。聞いた盤はおすすめから外れます。</div>';
  h+=criteriaHtml();
  items.forEach((x,i)=>{
    const c=x.c, r=ratingOf(c[0]);
    h+='<div class="card"><div class="recrow"><div class="scorebox"><div class="num">'+x.s+'</div><div class="lbl">MATCH</div></div><div style="flex:1;min-width:0">'
      +'<div class="atitle">'+(i+1)+'. '+esc(c[1])+'</div><div class="aartist">'+esc(c[2])+'</div>'
      +'<div class="ameta">'+c[3]+' ・ '+esc(c[4])+'</div>'+axesChips(c)
      +'<div class="areason">'+esc(c[6])+'</div>'
      +starsHtml(c[0], r? (r.stars||0):0)
      +'<div class="btnrow"><button class="btn small'+(r&&r.s==='want'?' on':'')+'" onclick="setRating(\''+c[0]+'\',{s:\'want\'})">気になる</button>'
      +'<a class="btn small" style="text-decoration:none;display:inline-flex;align-items:center" href="'+amLink(c)+'" target="_blank" rel="noopener">Apple Musicで探す</a></div>'
      +'</div></div></div>';
  });
  $('v-rec').innerHTML=h;
}
function criteriaHtml(){
  const cur=data.criteria? data.criteria : FALLBACK_PROFILE;
  let h='<div class="card"><div style="font-weight:700;font-size:.92em">好みの軸を調整'+(data.criteria?'':'<span style="color:var(--sub);font-weight:400;font-size:.82em">（今は基準プロフィール）</span>')+'</div>';
  AXES.forEach(([k,l])=>{ h+='<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><span style="width:64px;font-size:.83em;color:var(--sub)">'+l+'</span><input type="range" min="0" max="5" step="0.5" value="'+cur[k]+'" id="crit-'+k+'" style="flex:1" oninput="document.getElementById(\'critv-'+k+'\').textContent=this.value"><span id="critv-'+k+'" style="width:22px;text-align:right;font-size:.85em">'+cur[k]+'</span></div>'; });
  h+='<div class="btnrow"><button class="btn small primary" onclick="saveCriteria()">この軸で保存</button></div></div>';
  return h;
}
function saveCriteria(){
  const c={}; AXES.forEach(([k])=>{ c[k]=+($('crit-'+k)? $('crit-'+k).value : FALLBACK_PROFILE[k]); });
  data.criteria=c; data.criteriaUpdatedAt=Date.now(); saveLocal(); renderRec();
}
function renderTl(){
  let h='<div class="secttl">音楽の年表</div><div class="note">切れない一本の線の上に、時代の色がグラデーションで移っていく作り。まずはジャズを主軸に、彼の世界に接続する出来事を置いています。</div><div class="tl">';
  ERAS.forEach(er=>{
    h+='<div class="tl-era">'+er[0]+'–'+(er[1]-1)+'　'+esc(er[2])+'<span>'+esc(er[3])+'</span></div>';
    TIMELINE.filter(ev=>ev[0]>=er[0] && ev[0]<er[1]).forEach(ev=>{
      h+='<div class="tl-ev"><div><span class="tl-year">'+ev[0]+'</span><span class="tl-title">'+esc(ev[1])+'</span></div><div class="tl-note">'+esc(ev[3])+'</div></div>';
    });
  });
  h+='</div>';
  $('v-tl').innerHTML=h;
}
function splitLabel(s){
  if(s.length<=13) return [s];
  const mid=Math.floor(s.length/2); let best=-1,bd=1e9;
  for(let i=0;i<s.length;i++){ if(s[i]===' '||s[i]==='/'){ const d=Math.abs(i-mid); if(d<bd){bd=d;best=i;} } }
  if(best<0) return [s];
  return [s.slice(0,best).trim(), s.slice(best+(s[best]==='/'?1:0)).trim()];
}
function renderGraph(){
  const g=GRAPHS[curGraph];
  let h='<div class="secttl">相関図</div><div class="chiprow">'
    +'<button class="tagchip'+(curGraph==='jazz'?' on':'')+'" onclick="curGraph=\'jazz\';selNode=null;renderGraph()">ジャズ系譜図</button>'
    +'<button class="tagchip'+(curGraph==='world'?' on':'')+'" onclick="curGraph=\'world\';selNode=null;renderGraph()">世界観系譜図</button></div>';
  const pos={}; g.nodes.forEach(n=>pos[n[0]]={x:n[2],y:n[3]});
  let svg='<svg viewBox="0 0 360 560" style="width:100%;height:auto;display:block">';
  g.edges.forEach(e=>{
    const a=pos[e[0]], b=pos[e[1]]; if(!a||!b) return;
    svg+='<line class="edge" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'"/>';
    svg+='<text class="elbl" x="'+((a.x+b.x)/2)+'" y="'+((a.y+b.y)/2-3)+'" text-anchor="middle">'+esc(e[2])+'</text>';
  });
  g.nodes.forEach(n=>{
    const lines=splitLabel(n[1]);
    svg+='<g class="node'+(n[5]==='hub'?' hub':'')+(selNode===n[0]?' sel':'')+'" onclick="selNode=\''+n[0]+'\';renderGraph()"><circle cx="'+n[2]+'" cy="'+n[3]+'" r="'+(n[5]==='hub'?25:20)+'"/>'
      + lines.map((ln,i)=>'<text x="'+n[2]+'" y="'+(n[3]+(lines.length>1? (i===0?-1:10) : 3))+'" text-anchor="middle">'+esc(ln)+'</text>').join('') + '</g>';
  });
  svg+='</svg>';
  h+='<div class="gwrap">'+svg+'</div>';
  if(selNode){
    const n=g.nodes.find(x=>x[0]===selNode);
    if(n){
      const rels=g.edges.filter(e=>e[0]===selNode||e[1]===selNode).map(e=>{
        const other=g.nodes.find(x=>x[0]===(e[0]===selNode? e[1]:e[0]));
        return esc(e[2])+' — '+esc(other? other[1]:'');
      });
      h+='<div class="card" style="margin-top:10px"><div class="atitle">'+esc(n[1])+'</div><div class="areason">'+esc(n[4])+'</div>'
        + rels.map(r=>'<div class="ameta" style="margin-top:5px">・'+r+'</div>').join('') + '</div>';
    }
  } else {
    h+='<div class="note" style="margin-top:8px">人をタップすると関係の内訳が出ます。太い円が各図の中心人物です。</div>';
  }
  $('v-graph').innerHTML=h;
}
function renderLib(){
  const heard=[], want=[];
  Object.keys(data.ratings).forEach(id=>{ const r=ratingOf(id); if(!r) return; const c=catById(id); if(!c) return; (r.s==='heard'? heard: want).push({c, r}); });
  heard.sort((a,b)=>(b.r.stars||0)-(a.r.stars||0));
  let h='<div class="secttl">マイ記録 <span style="color:var(--sub);font-size:.78em">— RYM 風の自分の評価帳</span></div>';
  h+='<div class="note">聞いた '+(heard.length)+' 件 ／ 気になる '+want.length+' 件。評価とメモは端末と Drive（music.json）にだけ保存され、公開コードには入りません。</div>';
  function row(x){
    const c=x.c, r=x.r;
    return '<div class="card"><div class="atitle">'+esc(c[1])+'</div><div class="aartist">'+esc(c[2])+'</div><div class="ameta">'+(c[3]||'')+' ・ '+esc(c[4]||'')+'</div>'
      + starsHtml(c[0], r.stars||0)
      + '<textarea placeholder="メモ（任意）" onchange="setRating(\''+c[0]+'\',{memo:this.value})">'+esc(r.memo||'')+'</textarea>'
      + '<div class="btnrow">'
      + (r.s==='heard'? '<button class="btn small" onclick="setRating(\''+c[0]+'\',{s:\'want\'})">気になるへ移す</button>' : '<button class="btn small" onclick="setRating(\''+c[0]+'\',{s:\'heard\'})">聞いたにする</button>')
      + '<button class="btn small" onclick="clearRating(\''+c[0]+'\')">記録を消す</button></div></div>';
  }
  h+='<div class="secttl" style="font-size:.92em">聞いた</div>'+(heard.length? heard.map(row).join('') : '<div class="libempty">まだありません。おすすめで★を付けると、ここに貯まります。</div>');
  h+='<div class="secttl" style="font-size:.92em">気になる</div>'+(want.length? want.map(row).join('') : '<div class="libempty">まだありません。</div>');
  h+='<div class="card"><div style="font-weight:700;font-size:.92em">カタログ外の盤を記録</div>'
    +'<div style="margin-top:8px"><input class="textin" id="cu-title" placeholder="アルバム名"></div>'
    +'<div style="margin-top:8px"><input class="textin" id="cu-artist" placeholder="アーティスト名"></div>'
    +'<div class="btnrow"><button class="btn small primary" onclick="addCustom()">聞いた盤として追加</button></div></div>';
  $('v-lib').innerHTML=h;
}
function addCustom(){
  const t=($('cu-title').value||'').trim(), a=($('cu-artist').value||'').trim();
  if(!t||!a) return;
  const id='cu-'+Date.now().toString(36);
  data.custom[id]={title:t, artist:a, u:Date.now()};
  data.ratings[id]={s:'heard', stars:0, memo:'', u:Date.now(), del:false};
  saveLocal(); renderLib();
}
/* ================= settings ================= */
function renderSet(){
  const rc=relayCfg();
  let h='<div class="secttl">設定</div>';
  h+='<div class="card"><div style="font-weight:700">同期（中継）</div>'
    +'<div class="note" style="margin-top:4px">他のアプリと同じ中継で music.json と同期します。URL は初期値のまま、シークレットだけ貼ってください。</div>'
    +'<div style="margin-top:8px"><input class="textin" id="relay-url-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="中継の URL" value="'+(rc? escA(rc.url):RELAY_URL_DEFAULT)+'"></div>'
    +'<div style="margin-top:8px"><input class="textin" id="relay-secret-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="シークレット" value="'+(rc? escA(rc.secret):'')+'"></div>'
    +'<div class="btnrow"><button class="btn primary" onclick="relaySaveAndTest()">保存して接続テスト</button>'+(rc? '<button class="btn" onclick="relayClear()">中継を解除</button>':'')+'</div>'
    +'<div class="note" id="relaystat" style="margin-top:6px">'+(rc? '設定済みです。' : '未設定です（この間は端末内に保存されます）。')+'</div></div>';
  h+='<div class="card"><div style="font-weight:700">データ</div><div class="btnrow">'
    +'<button class="btn" onclick="exportData()">エクスポート</button>'
    +'<label class="btn" style="display:inline-flex;align-items:center">インポート<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>'
    +'</div></div>';
  h+='<div class="card"><div style="font-weight:700">このアプリについて</div><div class="note" style="margin-top:4px">Musilabo v'+APP_VERSION+'。おすすめ／年表／相関図／マイ記録を持つ独立版。本体は GitHub Pages、データは Google Drive の music.json。</div></div>';
  $('v-set').innerHTML=h;
}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='music.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function importData(inp){
  const f=inp.files && inp.files[0]; if(!f) return;
  f.text().then(tx=>{ try{ data=normalizeData(JSON.parse(tx)); saveLocal(); renderRec(); renderLib(); alert('取り込みました'); }catch(e){ alert('読み込めませんでした：'+e.message); } });
}
/* ================= relay + sync ================= */
const LS_RELAY='music.relay';
const RELAY_URL_DEFAULT='https://script.google.com/macros/s/AKfycbziV1Wpv7AWSUJJgaKyRzFeBR81Td4CjryGGuq4avt1xAo-e2mbeyS2vBpCuqx4_KI/exec';
function relayCfg(){ try{ const r=JSON.parse(storeGet(LS_RELAY)||'null'); return (r && r.secret)? {url:r.url||RELAY_URL_DEFAULT, secret:r.secret} : null; }catch(e){ return null; } }
function relayReady(){ return !!relayCfg(); }
async function relayCall(op, name, content){
  const c=relayCfg(); if(!c) throw new Error('中継が未設定です');
  const res=await fetch(c.url,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({secret:c.secret, op:op, name:name, content:content})});
  if(!res.ok) throw new Error('中継 HTTP '+res.status);
  const j=JSON.parse(await res.text());
  if(!j || !j.ok) throw new Error('中継エラー：'+((j&&j.error)||'unknown'));
  return j;
}
function relaySaveAndTest(){
  const u=$('relay-url-in'), s=$('relay-secret-in'), st=$('relaystat');
  const url=(u? u.value:'').trim()||RELAY_URL_DEFAULT, secret=(s? s.value:'').trim();
  if(!secret){ if(st) st.textContent='シークレットを入力してください'; return; }
  storeSet(LS_RELAY, JSON.stringify({url:url, secret:secret}));
  if(st) st.textContent='接続テスト中…';
  relayCall('ping').then(()=>{ if(st) st.textContent='接続OK — 中継で同期します。'; renderSyncStatus(); syncNow('relay'); renderSet(); })
    .catch(e=>{ if(st) st.textContent='接続に失敗しました：'+((e&&e.message)||e); });
}
function relayClear(){ storeDel(LS_RELAY); syncStatus='disconnected'; renderSyncStatus(); renderSet(); }
async function syncNow(reason){
  if(syncRunning || !relayReady()) return;
  syncRunning=true; syncStatus='syncing'; renderSyncStatus();
  try{
    const st=await relayCall('stat', DRIVE_FILE_NAME);
    let remote=null;
    if(st.exists){ const j=await relayCall('get', DRIVE_FILE_NAME); remote=normalizeData(JSON.parse(j.content)); }
    const merged=remote? mergeData(data, remote) : data;
    const changed=!remote || JSON.stringify(merged)!==JSON.stringify(remote);
    if(changed) await relayCall('put', DRIVE_FILE_NAME, JSON.stringify(merged));
    data=merged; storeSet(LS_DATA, JSON.stringify(data));
    syncStatus='synced'; lastSyncAt=Date.now();
    renderRec(); renderLib();
  }catch(e){ syncStatus='error'; syncErr=(e&&e.message)||String(e); }
  syncRunning=false; renderSyncStatus();
}
let syncErr='';
function scheduleSync(){ if(!relayReady()) return; if(syncTimer) clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow('auto'), 1500); }
function fmtTime(ts){ const d=new Date(ts); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function renderSyncStatus(){
  const dot=$('syncdot'), msg=$('syncmsg'); if(!dot||!msg) return;
  dot.style.background=(relayReady() && syncStatus!=='error')? 'var(--green)':'var(--red)';
  if(syncStatus==='synced') msg.innerHTML='同期済み（'+fmtTime(lastSyncAt)+'）<span class="sbhint"> ・ タップで再同期</span>';
  else if(syncStatus==='syncing') msg.textContent='同期中…';
  else if(syncStatus==='error') msg.innerHTML='同期エラー：'+esc(syncErr)+'<span class="sbhint"> ・ タップで再試行</span>';
  else if(relayReady()) msg.innerHTML='中継で接続済み（未同期）<span class="sbhint"> ・ タップで再同期</span>';
  else msg.innerHTML='未設定（端末内に保存中）<span class="sbhint"> ・ タップで設定へ</span>';
}
function syncBarTap(){ if(syncRunning) return; if(relayReady()) syncNow('manual'); else go('set'); }
/* ================= boot ================= */
function selfUpdate(){
  try{
    fetch(location.href.split('#')[0], {cache:'no-store'}).then(r=>r.text()).then(tx=>{
      const m=tx.match(/name="app-version" content="([\d.]+)"/);
      if(m && m[1]!==APP_VERSION && !sessionStorage.getItem('musicUpd')){
        sessionStorage.setItem('musicUpd','1');
        location.replace(location.href.split('#')[0]+'?v='+m[1]);
      }
    }).catch(()=>{});
  }catch(e){}
}
function boot(){
  $('verBadge').textContent='v'+APP_VERSION;
  renderRec(); renderTl(); renderGraph(); renderLib(); renderSet(); renderSyncStatus();
  moveInd();
  const veil=$('veil'); if(veil){ veil.style.opacity='0'; setTimeout(()=>veil.remove(), 700); }
  if(relayReady()) syncNow('startup');
  selfUpdate();
}
document.addEventListener('DOMContentLoaded', boot);
window.addEventListener('resize', moveInd);
</script>
